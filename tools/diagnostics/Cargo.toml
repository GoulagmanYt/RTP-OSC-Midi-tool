[package]
name = "oscmidi-diagnostics"
version = "2.1.0"
edition = "2021"
description = "Developer-only diagnostics for OSCMidi"
publish = false
autobins = false

[[bin]]
name = "rtp_probe"
path = "src/bin/rtp_probe.rs"

[[bin]]
name = "vst_smoke"
path = "src/bin/vst_smoke.rs"

[[bin]]
name = "vst_probe"
path = "src/bin/vst_probe.rs"

[[bin]]
name = "midi_stress"
path = "src/bin/midi_stress.rs"

[dependencies]
osc-midi-bridge = { path = "../../src-tauri" }
midi-types = "0.2.1"
rtpmidi = { version = "0.4.4", path = "../../vendor/rtpmidi" }
uuid = { version = "1.22", features = ["v4"] }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "time"] }
midir = "=0.11.0"
serde_json = "1.0"
rack = { version = "0.4.8", path = "../../vendor/rack" }
vst = { version = "0.4", path = "../../vendor/vst" }

[patch.crates-io]
rack = { path = "../../vendor/rack" }
vst = { path = "../../vendor/vst" }
rtpmidi = { path = "../../vendor/rtpmidi" }
