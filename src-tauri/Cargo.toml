[package]
name = "osc-midi-bridge"
version = "1.1.0"
edition = "2021"
default-run = "OSCMidi"

[lib]
name = "osc_midi_bridge"
path = "src/lib.rs"

[[bin]]
name = "OSCMidi"
path = "src/main.rs"

[[bin]]
name = "rtp_probe"
path = "src/bin/rtp_probe.rs"

[[bin]]
name = "vst_smoke"
path = "src/bin/vst_smoke.rs"

[[bin]]
name = "vst_probe"
path = "src/bin/vst_probe.rs"

[[bin]]
name = "vst-host-worker"
path = "src/bin/vst_host_worker.rs"

[[bin]]
name = "vst-worker-fixture"
path = "src/bin/vst_worker_fixture.rs"

[[bin]]
name = "midi_stress"
path = "src/bin/midi_stress.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
midir = "0.10"
rosc = "0.11"
crossbeam-channel = "0.5"
parking_lot = "0.12"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
rtpmidi = "0.4.4"
uuid = { version = "1.22", features = ["v4"] }
midi-types = "0.2.1"
mdns-sd = "0.18.2"
local-ip-address = "0.6.5"
window-vibrancy = "0.7"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Performance", "Win32_System_JobObjects", "Win32_Security", "Win32_Media", "Win32_Storage_FileSystem"] }
cpal = { version = "0.15.3", features = ["asio"] }
vst = "0.4"
rtrb = "0.3"
rack = "0.4.8"
smallvec = { version = "1.15", features = ["serde"] }
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"

[dev-dependencies]
tempfile = "3.27"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "performance_bench"
harness = false

[patch.crates-io]
rack = { path = "../vendor/rack" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# AJOUTER un profil dédié audio pour les release
[profile.release]
opt-level = 3
lto = "thin"        # thin LTO : meilleure perf sans exploser le temps de compile
codegen-units = 1
panic = "unwind"    # une panique de worker ne doit pas tuer tout le processus; active catch_unwind audio

# AJOUTER un profil dev optimisé pour les tests audio (le debug natif est trop lent pour l'audio)
[profile.dev-audio]
inherits = "dev"
opt-level = 2       # O2 en dev pour que le callback audio ne dropouts pas
