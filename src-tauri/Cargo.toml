[package]
name = "osc-midi-bridge"
version = "2.5.0"
edition = "2021"
description = "Low-latency Windows bridge for MIDI, RTP-MIDI, OSC, and isolated VST instruments"
authors = ["OSCMidi contributors"]
publish = false
default-run = "OSCMidi"
autobins = false

[features]
default = []
vst-worker-binary = []
worker-fixtures = ["vst-worker-binary"]

[lib]
name = "osc_midi_bridge"
path = "src/lib.rs"

[[bin]]
name = "OSCMidi"
path = "src/main.rs"

[[bin]]
name = "vst-host-worker"
path = "src/bin/vst_host_worker.rs"
required-features = ["vst-worker-binary"]

[[bin]]
name = "vst-worker-fixture"
path = "src/bin/vst_worker_fixture.rs"
required-features = ["worker-fixtures"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
midir = "=0.11.0"
rosc = "0.11"
crossbeam-channel = "0.5"
parking_lot = "0.12"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
crc32fast = "1.5"
rtpmidi = "0.4.4"
uuid = { version = "1.22", features = ["v4"] }
midi-types = "0.2.1"
mdns-sd = "0.18.2"
local-ip-address = "0.6.5"
window-vibrancy = "0.8"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Performance", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_Security", "Win32_Security_Authorization", "Win32_Media", "Win32_Storage_FileSystem"] }
cpal = { version = "=0.18.2", features = ["asio"] }
vst = "0.4"
rtrb = "0.3"
rack = "0.4.8"
smallvec = { version = "1.15", features = ["serde"] }
tauri-plugin-dialog = "2.7.2"

[dev-dependencies]
tempfile = "3.27"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "performance_bench"
harness = false

[patch.crates-io]
rack = { path = "../vendor/rack" }
vst = { path = "../vendor/vst" }
rtpmidi = { path = "../vendor/rtpmidi" }

# Thin LTO and a single codegen unit favor predictable callback performance in production.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

# Native plug-in diagnostics need optimized DSP code while retaining development symbols.
[profile.dev-audio]
inherits = "dev"
opt-level = 2
