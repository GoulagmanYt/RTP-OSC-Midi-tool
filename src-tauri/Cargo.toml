[package]
name = "osc-midi-bridge"
version = "0.1.0"
edition = "2021"
default-run = "OSCMidi"

[[bin]]
name = "OSCMidi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
midir = "0.10"
rosc = "0.11"
crossbeam-channel = "0.5"
parking_lot = "0.12"
once_cell = "1.21"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
rtpmidi = { version = "0.4.4", features = ["mdns"] }
uuid = { version = "1.22", features = ["v4"] }
midi-types = "0.2.1"
mdns-sd = "0.18.2"
window-vibrancy = "0.7"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Threading"] }
cpal = { version = "0.15.3", features = ["asio"] }
vst = "0.4"
rtrb = "0.3"
rack = "0.4.8"
smallvec = "1.15"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"

[dev-dependencies]
tempfile = "3.27"

[patch.crates-io]
rack = { path = "../vendor/rack" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
