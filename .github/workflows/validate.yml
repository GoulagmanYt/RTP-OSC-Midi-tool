name: Validate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

concurrency:
  group: oscmidi-validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22.12.0', '24']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Lint, type-check and test
        run: |
          pwsh -NoProfile -File scripts/validate.ps1 -Scope Frontend
          npm run build

  frontend-required:
    name: Frontend
    runs-on: ubuntu-latest
    needs: frontend
    if: always()
    steps:
      - name: Require every Node.js frontend job to pass
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: test "$FRONTEND_RESULT" = "success"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Cache cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-0.22.0

      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.0 --locked

      - name: Audit every Rust lockfile
        run: |
          cargo audit --file src-tauri/Cargo.lock --target-os windows
          cargo audit --file tools/diagnostics/Cargo.lock --target-os windows
          cargo audit --file vendor/rack/Cargo.lock --target-os windows
          cargo audit --file vendor/rtpmidi/Cargo.lock --target-os windows

  rust:
    name: Rust workspace
    runs-on: windows-latest
    timeout-minutes: 35

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CI: 'true'
      ASIOSDK_DIR: ${{ github.workspace }}\ASIOSDK
      ASIO_SDK_DIR: ${{ github.workspace }}\ASIOSDK
      CPAL_ASIO_DIR: ${{ github.workspace }}\ASIOSDK
      # Rust checks compile the app as a library before the release sidecar exists.
      TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js for script validation
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Restore Rust caches
        id: rust-cache
        uses: ./.github/actions/restore-rust-cache
        with:
          stage: validation

      - name: Validate application, diagnostics, vendored hosts and native audio
        shell: pwsh
        run: ./scripts/validate.ps1 -Scope Rust

      # Pull requests can read trusted main caches, but never write snapshots.
      - name: Save dependency downloads
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.dependency-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.rust-cache.outputs.dependency-key }}

      - name: Save exact pinned VST3 SDK
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.sdk-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vendor/rack/rack-sys/external/vst3sdk
          key: ${{ steps.rust-cache.outputs.sdk-key }}

      - name: Save validated compilation snapshot
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.build-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.rust-cache.outputs.build-paths }}
          key: ${{ steps.rust-cache.outputs.build-key }}
