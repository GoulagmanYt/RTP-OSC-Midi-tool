name: Build Windows App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CI: 'true'
      ASIOSDK_DIR: ${{ github.workspace }}\ASIOSDK
      ASIO_SDK_DIR: ${{ github.workspace }}\ASIOSDK
      CPAL_ASIO_DIR: ${{ github.workspace }}\ASIOSDK

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            .cargo-target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Install frontend dependencies
        run: npm ci --no-fund --no-audit

      - name: Validate application version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoMetadata = cargo metadata `
            --manifest-path src-tauri/Cargo.toml `
            --format-version 1 `
            --no-deps | ConvertFrom-Json
          $cargoVersion = $cargoMetadata.packages[0].version

          $versions = @($packageVersion, $tauriVersion, $cargoVersion) | Sort-Object -Unique
          if ($versions.Count -ne 1) {
            throw "Version mismatch: package.json=$packageVersion, tauri.conf.json=$tauriVersion, Cargo.toml=$cargoVersion"
          }

          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Release tag $env:GITHUB_REF_NAME does not match application version v$packageVersion"
          }

          Write-Host "Validated OSCMidi version $packageVersion"

      - name: Validate frontend
        run: |
          npm run lint
          npm test

      - name: Validate Rust
        env:
          # Rust checks compile the app as a library before the release sidecar exists.
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --package osc-midi-bridge -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features
          cargo fmt --manifest-path tools/diagnostics/Cargo.toml --package oscmidi-diagnostics -- --check
          cargo clippy --manifest-path tools/diagnostics/Cargo.toml --target-dir tools/diagnostics/target --all-targets -- -D warnings

      - name: Build Tauri application and MSI installer
        run: npm run tauri:build -- --bundles msi --ci

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $binary = Get-Item '.cargo-target/release/OSCMidi.exe' -ErrorAction Stop
          $worker = Get-Item `
            'src-tauri/binaries/vst-host-worker-x86_64-pc-windows-msvc.exe' `
            -ErrorAction Stop
          $installers = @(
            Get-ChildItem '.cargo-target/release/bundle/msi' `
              -Filter '*.msi' `
              -File `
              -ErrorAction SilentlyContinue
          )

          if ($installers.Count -ne 1) {
            throw "Expected one MSI installer, found $($installers.Count)."
          }

          Copy-Item -LiteralPath $binary.FullName -Destination 'artifacts/OSCMidi.exe'
          Copy-Item -LiteralPath $worker.FullName -Destination 'artifacts/vst-host-worker.exe'
          Copy-Item -LiteralPath $installers[0].FullName -Destination artifacts/

          $portableDirectory = Join-Path $env:RUNNER_TEMP 'OSCMidi-portable'
          if (Test-Path -LiteralPath $portableDirectory) {
            Remove-Item -LiteralPath $portableDirectory -Recurse -Force
          }
          New-Item -ItemType Directory -Path $portableDirectory | Out-Null
          Copy-Item -LiteralPath $binary.FullName -Destination (Join-Path $portableDirectory 'OSCMidi.exe')
          Copy-Item -LiteralPath $worker.FullName -Destination (Join-Path $portableDirectory 'vst-host-worker.exe')

          $portableArchive = "artifacts/OSCMidi_${version}_windows_x64_portable.zip"
          Compress-Archive -Path (Join-Path $portableDirectory '*') -DestinationPath $portableArchive

          $releaseFiles = @($installers[0], (Get-Item $portableArchive))
          $hashLines = foreach ($file in $releaseFiles | Sort-Object Name) {
            $hash = Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256
            "$($hash.Hash)  $($file.Name)"
          }
          [System.IO.File]::WriteAllLines(
            (Join-Path $env:GITHUB_WORKSPACE 'artifacts/SHA256SUMS.txt'),
            $hashLines,
            [System.Text.UTF8Encoding]::new($false)
          )

          Get-ChildItem artifacts -File | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: OSCMidi-windows-${{ github.ref_name }}
          path: artifacts/*
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repository = $env:GITHUB_REPOSITORY
          $msi = @(Get-ChildItem artifacts -Filter '*.msi' -File -ErrorAction Stop)
          $portable = @(Get-ChildItem artifacts -Filter '*_portable.zip' -File -ErrorAction Stop)
          $checksums = Get-Item artifacts/SHA256SUMS.txt -ErrorAction Stop
          if ($msi.Count -ne 1 -or $portable.Count -ne 1) {
            throw "Expected one MSI and one portable archive; found $($msi.Count) and $($portable.Count)."
          }
          $assets = @($msi[0].FullName, $portable[0].FullName, $checksums.FullName)

          gh release view $tag --repo $repository *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo $repository --clobber
          } else {
            gh release create $tag @assets `
              --repo $repository `
              --verify-tag `
              --generate-notes `
              --title "OSCMidi $tag"
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish GitHub Release $tag"
          }
