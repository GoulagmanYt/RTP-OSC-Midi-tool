name: Build Windows App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      ASIOSDK_DIR: ${{ github.workspace }}\ASIOSDK
      ASIO_SDK_DIR: ${{ github.workspace }}\ASIOSDK
      CPAL_ASIO_DIR: ${{ github.workspace }}\ASIOSDK
      TAURI_BUNDLE_TARGETS: app,msi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../.cargo-target

      - name: Install frontend dependencies
        run: npm ci --no-fund --no-audit

      - name: Build Tauri application
        run: npm run tauri:build

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $patterns = @(
            '.cargo-target/release/OSCMidi.exe',
            '.cargo-target/release/bundle/msi/*.msi',
            '.cargo-target/release/bundle/nsis/*.exe',
            '.cargo-target/release/bundle/app/*.exe'
          )

          $found = @()
          foreach ($pattern in $patterns) {
            $found += Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue
          }

          if (-not $found) {
            Write-Error 'No Windows build artifacts were found.'
            exit 1
          }

          foreach ($file in $found | Sort-Object FullName -Unique) {
            Copy-Item -LiteralPath $file.FullName -Destination artifacts/
          }

          Get-ChildItem artifacts -File | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OSCMidi-windows-${{ github.ref_name }}
          path: artifacts/*
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
