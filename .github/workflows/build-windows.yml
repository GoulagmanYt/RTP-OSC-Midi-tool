name: Build Windows App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Build, sign and publish the current version
        required: false
        default: false
        type: boolean

concurrency:
  group: oscmidi-windows-${{ github.ref }}-${{ inputs.publish_release && 'publish' || 'build' }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validation:
    name: Validate before packaging
    uses: ./.github/workflows/validate.yml

  build-windows:
    name: Build Windows executable
    needs: validation
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CI: 'true'
      ASIOSDK_DIR: ${{ github.workspace }}\ASIOSDK
      ASIO_SDK_DIR: ${{ github.workspace }}\ASIOSDK
      CPAL_ASIO_DIR: ${{ github.workspace }}\ASIOSDK

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc

      - name: Validate release publication policy
        id: release
        shell: pwsh
        env:
          REQUEST_PUBLISH: ${{ inputs.publish_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/validate.ps1 -Scope Version
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $isVersionTagPush = $env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_TYPE -eq 'tag'
          $isManualPublish = $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:REQUEST_PUBLISH -eq 'true'
          $publish = $isVersionTagPush -or $isManualPublish
          if ($publish) {
            $tags = @(gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')
            if ($LASTEXITCODE -ne 0) { throw 'Could not check existing releases; publication refused.' }
            if ($tags -contains $tag) { throw "Release $tag already exists. Bump the version to publish new packages." }
            $remoteTags = @(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
            if ($LASTEXITCODE -ne 0) { throw 'Could not check remote version tag.' }
            if ($remoteTags.Count -gt 0) {
              $dereferenced = @($remoteTags | Where-Object { $_ -match '\^\{\}$' })
              $tagCommit = (($dereferenced + $remoteTags)[0] -split '\s+')[0]
              if ($tagCommit -ne $env:GITHUB_SHA) { throw "Tag $tag refers to another commit. Bump the version." }
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Restore Rust caches
        id: rust-cache
        uses: ./.github/actions/restore-rust-cache
        with:
          stage: release

      - name: Install frontend dependencies
        run: npm ci --no-fund --no-audit --prefer-offline

      - name: Validate publication and cache behavior
        shell: pwsh
        run: ./scripts/test-ci-workflows.ps1

      - name: Remove stale bundle outputs
        shell: pwsh
        run: |
          $repositoryRoot = $env:GITHUB_WORKSPACE
          . ./scripts/build-support.ps1
          Remove-GeneratedDirectory '.cargo-target/release/bundle'
          Remove-GeneratedDirectory '.cargo-target/release/wix'

      - name: Resolve release signing mode
        id: signing
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $configured = @(
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE),
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD),
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)
          )
          $configuredCount = @($configured | Where-Object { $_ }).Count
          if ($configuredCount -eq 0) {
            'enabled=false' >> $env:GITHUB_OUTPUT
            Write-Warning 'Publishing unsigned packages because no Windows signing secrets are configured.'
          } elseif ($configuredCount -eq 3) {
            'enabled=true' >> $env:GITHUB_OUTPUT
            Write-Host 'Windows release signing is enabled.'
          } else {
            throw 'Windows release signing is partially configured. Set all three signing secrets or remove all three.'
          }

      - name: Import release signing certificate
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'oscmidi-release.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          try {
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate `
              -FilePath $certificatePath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password `
              -Exportable:$false
            if ($null -eq $certificate -or [string]::IsNullOrWhiteSpace($certificate.Thumbprint)) {
              throw 'The Windows release certificate could not be imported.'
            }
            "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
            "WINDOWS_TIMESTAMP_URL=$env:WINDOWS_TIMESTAMP_URL" >> $env:GITHUB_ENV
          } finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Build Tauri application and MSI installer
        shell: pwsh
        run: |
          if ('${{ steps.signing.outputs.enabled }}' -eq 'true') {
            $override = @{
              bundle = @{
                windows = @{
                  certificateThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT
                  digestAlgorithm = 'sha256'
                  timestampUrl = $env:WINDOWS_TIMESTAMP_URL
                }
              }
            } | ConvertTo-Json -Depth 5 -Compress
            $env:TAURI_CONFIG = $override
          }
          npm run tauri:build -- --bundles msi --ci -- --locked --timings

      - name: Verify release Authenticode signatures
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $files = @(
            Get-Item '.cargo-target/release/OSCMidi.exe' -ErrorAction Stop
            Get-Item 'src-tauri/binaries/vst-host-worker-x64-x86_64-pc-windows-msvc.exe' -ErrorAction Stop
            Get-Item 'src-tauri/binaries/vst-host-worker-x86-x86_64-pc-windows-msvc.exe' -ErrorAction Stop
            Get-ChildItem '.cargo-target/release/bundle/msi' -Filter '*.msi' -File -ErrorAction Stop
          )
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for $($file.FullName): $($signature.Status)"
            }
          }

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $binary = Get-Item '.cargo-target/release/OSCMidi.exe' -ErrorAction Stop
          $workerX64 = Get-Item `
            'src-tauri/binaries/vst-host-worker-x64-x86_64-pc-windows-msvc.exe' `
            -ErrorAction Stop
          $workerX86 = Get-Item `
            'src-tauri/binaries/vst-host-worker-x86-x86_64-pc-windows-msvc.exe' `
            -ErrorAction Stop
          $installers = @(
            Get-ChildItem '.cargo-target/release/bundle/msi' `
              -Filter "OSCMidi_${version}_*.msi" `
              -File `
              -ErrorAction SilentlyContinue
          )

          if ($installers.Count -ne 1) {
            throw "Expected one MSI installer, found $($installers.Count)."
          }

          Copy-Item -LiteralPath $installers[0].FullName -Destination artifacts/

          $portableDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts/portable'
          New-Item -ItemType Directory -Path $portableDirectory | Out-Null
          Copy-Item -LiteralPath $binary.FullName -Destination (Join-Path $portableDirectory 'OSCMidi.exe')
          Copy-Item -LiteralPath $workerX64.FullName -Destination (Join-Path $portableDirectory 'vst-host-worker-x64.exe')
          Copy-Item -LiteralPath $workerX86.FullName -Destination (Join-Path $portableDirectory 'vst-host-worker-x86.exe')

          $portableArchive = "artifacts/OSCMidi_${version}_windows_x64_portable.zip"
          Compress-Archive -Path (Join-Path $portableDirectory '*') -DestinationPath $portableArchive

          $buildInfoPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/BUILDINFO.json'
          $buildInfo = [ordered]@{
            schemaVersion = 1
            version = $version
            tag = "v$version"
            commit = $env:GITHUB_SHA
            repository = $env:GITHUB_REPOSITORY
            workflowRunId = $env:GITHUB_RUN_ID
            workflowRunAttempt = [int]$env:GITHUB_RUN_ATTEMPT
            builtAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            mutableReleaseAssets = $false
            authenticodeSigned = '${{ steps.signing.outputs.enabled }}' -eq 'true'
          } | ConvertTo-Json -Depth 3
          [System.IO.File]::WriteAllText(
            $buildInfoPath,
            $buildInfo,
            [System.Text.UTF8Encoding]::new($false)
          )

          $releaseFiles = @(
            $installers[0],
            (Get-Item $portableArchive),
            (Get-Item $buildInfoPath)
          )
          $hashLines = foreach ($file in $releaseFiles | Sort-Object Name) {
            $hash = Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256
            "$($hash.Hash)  $($file.Name)"
          }
          [System.IO.File]::WriteAllLines(
            (Join-Path $env:GITHUB_WORKSPACE 'artifacts/SHA256SUMS.txt'),
            $hashLines,
            [System.Text.UTF8Encoding]::new($false)
          )

          Get-ChildItem artifacts -File | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OSCMidi-windows-${{ steps.release.outputs.version }}-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Save dependency downloads
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.dependency-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.rust-cache.outputs.dependency-key }}

      - name: Save exact pinned VST3 SDK
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.sdk-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vendor/rack/rack-sys/external/vst3sdk
          key: ${{ steps.rust-cache.outputs.sdk-key }}

      - name: Remove packaging intermediates from compilation cache
        shell: pwsh
        run: |
          $repositoryRoot = $env:GITHUB_WORKSPACE
          . ./scripts/build-support.ps1
          Remove-GeneratedDirectory '.cargo-target/release/bundle'
          Remove-GeneratedDirectory '.cargo-target/release/wix'

      - name: Save release compilation snapshot
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.build-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.rust-cache.outputs.build-paths }}
          key: ${{ steps.rust-cache.outputs.build-key }}

      - name: Ensure version tag exists
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git ls-remote --exit-code --tags origin "refs/tags/$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            $remote = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG" "refs/tags/$env:RELEASE_TAG^{}")
            if ($LASTEXITCODE -ne 0) { throw 'Could not verify remote tag.' }
            $peeled = @($remote | Where-Object { $_ -match '\^\{\}$' })
            if ((($peeled + $remote)[0] -split '\s+')[0] -ne $env:GITHUB_SHA) {
              throw 'The version tag points to another commit; publication refused.'
            }
            Write-Host "Verified immutable tag $env:RELEASE_TAG"
          } elseif ($LASTEXITCODE -eq 2) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag --annotate $env:RELEASE_TAG $env:GITHUB_SHA `
              --message "OSCMidi $env:RELEASE_TAG"
            git push origin "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create version tag $env:RELEASE_TAG"
            }
          } else {
            throw "Failed to query version tag $env:RELEASE_TAG"
          }

      - name: Attach artifacts to GitHub Release
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $repository = $env:GITHUB_REPOSITORY
          $msi = @(Get-ChildItem artifacts -Filter '*.msi' -File -ErrorAction Stop)
          $portable = @(Get-ChildItem artifacts -Filter '*_portable.zip' -File -ErrorAction Stop)
          $checksums = Get-Item artifacts/SHA256SUMS.txt -ErrorAction Stop
          $buildInfo = Get-Item artifacts/BUILDINFO.json -ErrorAction Stop
          if ($msi.Count -ne 1 -or $portable.Count -ne 1) {
            throw "Expected one MSI and one portable archive; found $($msi.Count) and $($portable.Count)."
          }
          $assets = @(
            $msi[0].FullName,
            $portable[0].FullName,
            $checksums.FullName,
            $buildInfo.FullName
          )

          # Never replace assets. A concurrent publication makes this fail safely.
          gh release create $tag @assets `
            --repo $repository `
            --verify-tag `
            --generate-notes `
            --title "OSCMidi $tag"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish GitHub Release $tag"
          }

          $published = gh release view $tag --repo $repository --json assets | ConvertFrom-Json
          foreach ($expected in @($msi[0].Name, $portable[0].Name, $checksums.Name, $buildInfo.Name)) {
            $asset = @($published.assets | Where-Object name -eq $expected)
            if ($asset.Count -ne 1 -or $asset[0].size -le 0) {
              throw "Release asset verification failed for $expected"
            }
          }
          Write-Host "Published and verified release assets for $tag at commit $env:GITHUB_SHA"
