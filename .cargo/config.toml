[build]
# Keep Cargo build artifacts in the repository workspace on every machine.
target-dir = ".cargo-target"
incremental = false

[env]
# CPAL ASIO build support. Paths are relative to this repository root.
ASIOSDK_DIR = { value = "ASIOSDK", relative = true }
ASIO_SDK_DIR = { value = "ASIOSDK", relative = true }
CPAL_ASIO_DIR = { value = "ASIOSDK", relative = true }
